# Stage-2 — Miko Tiny (~2.3M with 16K vocab) on dataset-v0.2
# (48M tokens: vi-wiki + en-wiki + permissive-license Python).
# Purpose: quick dataset-quality probe before committing to the 38M run.

model:
  vocab_size: 16000    # matches tokenizer/real_v0.2/tokenizer.json
  hidden_size: 96
  num_layers: 4
  num_heads: 6
  ffn_size: 384
  context_length: 128
  activation: swiglu
  use_rope: true
  tie_embeddings: true

data:
  train_dir: data/shards_v2/train
  val_dir: data/shards_v2/val

train:
  optimizer: adamw
  seq_len: 128
  batch_size: 1
  grad_accum: 4
  max_steps: 4000
  lr: 1.0e-3
  min_lr_ratio: 0.1
  warmup_pct: 0.05
  weight_decay: 0.1
  betas: [0.9, 0.95]
  clip_grad: 1.0
  seed: 42
  log_every: 100
  eval_every: 500
  eval_batches: 16
  checkpoint_every: 1000
  milestone_every: 4000
  keep_last: 2
  out_dir: checkpoints_tiny_v2
  log_csv: logs/train_tiny_v2.csv
