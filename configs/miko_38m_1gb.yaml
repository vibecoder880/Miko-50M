# Miko 38M-1GB — fit variant for the strict 1 GB RAM target box.
#
# Same width as Miko 50M but 16K vocab (plan §7-9) and 12 layers:
#   params = 38,004,096 (~38M)
# With Adafactor this trains in ~750-850 MB RSS (measured by
# scripts/benchmark_cpu.py), leaving room for OS + SSH on a 1 GB box.
# Miko 50M (32K vocab) needs ~940 MB RSS with Adafactor — use it only
# when ~1.3 GB total RAM is available.
vocab_size: 16000
hidden_size: 384
num_layers: 12
num_heads: 6
ffn_size: 1792
context_length: 512
activation: swiglu
use_rope: true
tie_embeddings: true
norm_eps: 1.0e-6
