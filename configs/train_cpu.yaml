# CPU pretraining run — Miko 50M (plan §16 stage C, §42-45).
# RAM-first settings: micro-batch 1, grad accumulation 16, context staged.
# Start with seq_len 128 (stage A) and raise to 256/512 as RAM allows.

model:
  vocab_size: 32000
  hidden_size: 384
  num_layers: 13
  num_heads: 6
  ffn_size: 2048
  context_length: 512
  activation: swiglu
  use_rope: true
  tie_embeddings: true

data:
  train_dir: data/shards/train
  val_dir: data/shards/val

train:
  seq_len: 128          # stage A: 128 -> 256 -> 512
  batch_size: 1
  grad_accum: 16
  max_steps: 1000       # smoke-test budget; raise for the real run
  lr: 3.0e-4
  min_lr_ratio: 0.1
  warmup_pct: 0.03
  weight_decay: 0.1
  betas: [0.9, 0.95]
  clip_grad: 1.0
  seed: 42
  log_every: 10
  eval_every: 200
  eval_batches: 20
  checkpoint_every: 250
  milestone_every: 1000
  keep_last: 2
  out_dir: checkpoints
  log_csv: logs/train.csv
